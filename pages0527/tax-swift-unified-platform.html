<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax-Swift 运营管理平台</title>
  <style>
    :root {
      --bg: #f7f9fd;
      --surface: #ffffff;
      --line: #e8edf6;
      --line-strong: #d9e3f3;
      --text: #182338;
      --muted: #69758e;
      --blue: #1f6bff;
      --blue-deep: #1452ea;
      --blue-soft: #eef5ff;
      --shadow: 0 10px 32px rgba(25, 58, 125, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fdfefe, #f7f9fd);
    }

    body.modal-open {
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---- Layout ---- */
    .platform-page {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      position: relative;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.92);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    .brand-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
    }

    .brand-mark svg {
      stroke: #fff;
      stroke-width: 2.5;
    }

    .brand-copy {
      display: grid;
      gap: 4px;
    }

    .brand-copy strong {
      font-size: 18px;
      line-height: 1.15;
      font-weight: 700;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .scope-switch {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      margin: 18px 16px 0;
      padding: 12px 16px;
      border: 1px solid #e5edf8;
      border-radius: 22px;
      background: #fff;
      box-shadow: var(--shadow);
      color: #24324e;
      font-size: 16px;
      font-weight: 600;
    }

    .scope-copy {
      display: grid;
      gap: 3px;
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .scope-copy strong {
      overflow: hidden;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      color: #1f2d48;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scope-copy small {
      font-size: 12px;
      font-weight: 600;
      color: #738098;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- Context Popover ---- */
    .context-popover {
      position: fixed;
      z-index: 50;
      top: 96px;
      left: 0;
      width: min(736px, calc(100vw - 16px));
      max-height: calc(100vh - 112px);
      padding: 24px;
      border: 1px solid #e3eaf7;
      border-left: 0;
      border-radius: 0 28px 28px 0;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 28px 80px rgba(24, 45, 91, 0.18);
      backdrop-filter: blur(18px);
      overflow-y: auto;
    }

    .context-popover[hidden] {
      display: none;
    }

    .context-search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 18px;
      border: 1px solid #bfd0ea;
      border-radius: 14px;
      background: #fff;
    }

    .context-search svg {
      width: 22px;
      height: 22px;
      color: #53627e;
      flex: 0 0 auto;
    }

    .context-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #1e2a43;
      font-size: 15px;
      font-weight: 700;
    }

    .context-search input::placeholder {
      color: #9da8ba;
    }

    .context-list {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .context-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 78px;
      padding: 14px 16px;
      border: 1px solid #e5edf8;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: #253351;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(33, 77, 190, 0.04);
    }

    .context-item:hover {
      border-color: #b9d1ff;
      background: #f8fbff;
    }

    .context-item.active {
      border-color: var(--blue);
      background: linear-gradient(180deg, #f8fbff, #eef5ff);
      color: var(--blue);
    }

    .context-item.hidden-by-search,
    .context-section-title.hidden-by-search {
      display: none;
    }

    .context-section-title {
      margin: 4px 0 2px 8px;
      color: #7a859c;
      font-size: 13px;
      font-weight: 700;
    }

    .context-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3a8cff, #1557ef);
      color: #fff;
      box-shadow: 0 16px 28px rgba(31, 107, 255, 0.18);
      font-size: 16px;
      font-weight: 800;
    }

    .context-avatar.globe {
      background: #edf5ff;
      color: var(--blue);
      box-shadow: none;
    }

    .context-avatar svg {
      width: 27px;
      height: 27px;
      stroke-width: 1.8;
    }

    .context-copy {
      display: grid;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .context-copy strong {
      overflow: hidden;
      color: #1f2d48;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-copy small {
      overflow: hidden;
      color: #6d7891;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-item.active .context-copy strong {
      color: var(--blue);
    }

    .context-check {
      display: none;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      color: var(--blue);
    }

    .context-item.active .context-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .scope-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--blue);
    }

    .scope-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: auto;
      color: #68748c;
    }

    .sidebar-nav {
      padding: 22px 16px 0;
    }

    .nav-group + .nav-group {
      margin-top: 22px;
    }

    .nav-group h2 {
      margin: 0 0 10px 8px;
      color: #738098;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 48px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #43516c;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      text-align: left;
    }

    .nav-item + .nav-item {
      margin-top: 6px;
    }

    .nav-item:hover {
      background: #f5f8ff;
    }

    .nav-item.active {
      background: linear-gradient(180deg, #edf5ff, #e8f1ff);
      color: var(--blue);
    }

    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 18px 16px 22px;
      border-top: 1px solid var(--line);
    }

    /* ---- Topbar ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 0 28px 0 34px;
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--line);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #68758e;
      font-size: 15px;
      font-weight: 800;
    }

    .breadcrumb strong {
      color: #27344f;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .topbar-actions {
      display: flex;
      gap: 26px;
    }

    .top-action {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      color: #1f2d48;
      font-size: 16px;
      font-weight: 600;
    }

    .top-action-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    .badge-dot {
      position: absolute;
      top: -8px;
      right: -12px;
      display: grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: #ff3d3d;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .user-summary {
      display: flex;
      align-items: center;
      gap: 13px;
      position: relative;
    }

    .user-text {
      display: grid;
      gap: 2px;
      text-align: right;
    }

    .user-text strong {
      font-size: 16px;
      font-weight: 700;
    }

    .user-text span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .avatar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(145deg, #16203a, #28517f 68%, #1f6bff);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 0 0 3px rgba(31, 107, 255, 0.12);
    }

    .user-menu {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 50;
      margin-top: 8px;
      width: 248px;
      padding: 8px;
      border: 1px solid #e8edf6;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(25, 58, 125, 0.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms;
    }

    .user-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .user-menu-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px 12px;
      border-bottom: 1px solid #eef2f8;
    }

    .avatar-large {
      width: 40px;
      height: 40px;
      font-size: 16px;
    }

    .user-menu-copy {
      display: grid;
      gap: 2px;
    }

    .user-menu-copy strong {
      font-size: 15px;
    }

    .user-menu-copy span {
      color: var(--muted);
      font-size: 13px;
    }

    .user-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #27344f;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
    }

    .user-menu-item:hover {
      background: #f5f7fb;
    }

    .user-menu-item.logout {
      color: #c24a4a;
    }

    .menu-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }

    /* ---- Main / Iframe ---- */
    .main-shell {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }

    .iframe-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #f7f9fd;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ---- Password Modal ---- */
    .password-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(14, 29, 61, 0.24);
      opacity: 0;
      visibility: hidden;
      transition: opacity 140ms ease, visibility 0s linear 140ms;
    }

    .password-modal-overlay.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 140ms ease;
    }

    .password-modal {
      width: min(480px, 92vw);
      padding: 0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(20, 45, 90, 0.22);
    }

    .password-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
    }

    .password-modal-head h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .password-close {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      font-size: 22px;
      color: #6f7788;
    }

    .password-modal-body {
      padding: 16px 24px 8px;
    }

    .password-note {
      margin: 0 0 16px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #fef7e6;
      color: #8d6b10;
      font-size: 14px;
      font-weight: 600;
    }

    .password-field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .password-field span {
      font-size: 14px;
      font-weight: 800;
      color: #374151;
    }

    .password-field em {
      color: #e53e3e;
      font-style: normal;
    }

    .password-input-shell {
      position: relative;
      display: flex;
      align-items: center;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      overflow: hidden;
    }

    .password-input-shell input {
      width: 100%;
      height: 100%;
      padding: 0 52px 0 16px;
      border: 0;
      outline: none;
      font-size: 15px;
      font-weight: 600;
    }

    .password-eye {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #9ca3af;
    }

    .password-eye svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .password-rules {
      margin: 8px 0 0;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f8fafc;
    }

    .password-rules h3 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      color: #374151;
    }

    .password-rules ul {
      margin: 0;
      padding: 0 0 0 18px;
      display: grid;
      gap: 4px;
    }

    .password-rules li {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
    }

    .password-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px 20px;
    }

    .password-cancel {
      min-width: 80px;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      font-weight: 800;
      color: #374151;
    }

    .password-submit {
      min-width: 100px;
      min-height: 42px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--blue), var(--blue-deep));
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 16px rgba(31, 107, 255, 0.18);
    }

    /* ---- Responsive ---- */
    @media (max-width: 1280px) {
      .platform-page {
        grid-template-columns: 248px minmax(0, 1fr);
      }
    }

    @media (max-width: 980px) {
      .platform-page {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .topbar {
        min-height: auto;
        padding: 14px 16px;
      }

      .topbar-actions {
        display: none;
      }

      .user-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="platform-page">
    <!-- ====== Sidebar ====== -->
    <aside class="sidebar" aria-label="主导航">
      <div class="brand-panel">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 56 56">
            <defs>
              <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2d85ff" />
                <stop offset="100%" stop-color="#1352e8" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#brandBg)" />
            <path d="M14 20h28M18 20v16M38 20v16M12 36h32M21 17l7-6 7 6" />
          </svg>
        </div>
        <div class="brand-copy">
          <strong>Tax-Swift</strong>
          <span>全球智能税务合规平台</span>
        </div>
      </div>

      <button class="scope-switch" id="scopeSwitch" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="scope-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6Z" />
            <path d="M3.8 12h16.4M12 3.8c2.3 2.2 3.7 5.1 3.7 8.2S14.3 18 12 20.2c-2.3-2.2-3.7-5.1-3.7-8.2S9.7 6 12 3.8Z" />
          </svg>
        </span>
        <span class="scope-copy">
          <strong id="scopeTitle">全球视角</strong>
          <small id="scopeSubtitle">租户域管理工作台</small>
        </span>
        <span class="scope-chevron" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" /></svg>
        </span>
      </button>

      <section class="context-popover" id="contextPopover" hidden aria-label="切换工作视角">
        <div class="context-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4 4" />
          </svg>
          <input id="contextSearch" type="search" placeholder="搜索企业名称 / 国家" />
        </div>
        <div class="context-list" id="contextList">
          <div class="context-section-title" data-context-section="global">管理视角</div>
          <button class="context-item active" data-context-id="global" data-scope="global" data-title="全球视角" data-subtitle="租户域管理工作台" type="button">
            <span class="context-avatar globe" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6Z" />
                <path d="M3.8 12h16.4M12 3.8c2.3 2.2 3.7 5.1 3.7 8.2S14.3 18 12 20.2c-2.3-2.2-3.7-5.1-3.7-8.2S9.7 6 12 3.8Z" />
              </svg>
            </span>
            <span class="context-copy">
              <strong>全球视角</strong>
              <small>租户域统计、企业管理、用户管理、API 应用、...</small>
            </span>
            <span class="context-check" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11" /></svg>
            </span>
          </button>
          <div class="context-section-title" data-context-section="enterprise">企业视角</div>
          <button class="context-item" data-context-id="vn" data-scope="enterprise" data-title="Baiwang Vietnam Industrial Co., Ltd." data-subtitle="Vietnam · 发票生命周期管理" type="button">
            <span class="context-avatar" aria-hidden="true">VN</span>
            <span class="context-copy">
              <strong>🇻🇳 Baiwang Vietnam Industrial Co., Ltd.</strong>
              <small>Vietnam · 发票生命周期管理</small>
            </span>
            <span class="context-check" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11" /></svg>
            </span>
          </button>
          <button class="context-item" data-context-id="my" data-scope="enterprise" data-title="Malaysia Test Branch" data-subtitle="Malaysia · 发票生命周期管理" type="button">
            <span class="context-avatar" aria-hidden="true">MY</span>
            <span class="context-copy">
              <strong>🇲🇾 Malaysia Test Branch</strong>
              <small>Malaysia · 发票生命周期管理</small>
            </span>
            <span class="context-check" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11" /></svg>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var iframe = document.getElementById('contentFrame');
      var breadcrumbTitle = document.getElementById('breadcrumbTitle');
      var navGlobal = document.getElementById('navGlobal');
      var navEnterprise = document.getElementById('navEnterprise');
      var userSummary = document.getElementById('userSummary');
      var userMenu = document.getElementById('userMenu');
      var passwordModal = document.getElementById('passwordModal');
      var openPasswordBtn = document.getElementById('openPasswordModal');
      var closePasswordBtns = document.querySelectorAll('[data-close-password]');
      var eyeButtons = document.querySelectorAll('.password-eye');
      var scopeSwitch = document.getElementById('scopeSwitch');
      var contextPopover = document.getElementById('contextPopover');
      var contextSearch = document.getElementById('contextSearch');
      var contextList = document.getElementById('contextList');
      var contextItems = document.querySelectorAll('.context-item[data-scope]');
      var contextSections = document.querySelectorAll('.context-section-title[data-context-section]');
      var scopeTitle = document.getElementById('scopeTitle');
      var scopeSubtitle = document.getElementById('scopeSubtitle');

      // Current scope: 'global' or 'enterprise'
      var currentScope = 'global';
      var currentContextId = 'global';
      var currentPage = 'dashboard';

      function getNavItems() {
        var visibleNav = currentScope === 'global' ? navGlobal : navEnterprise;
        return visibleNav.querySelectorAll('.nav-item[data-page]');
      }

      var scopeLabels = {
        global: { title: '全球视角', subtitle: '租户域管理工作台' },
        enterprise: { title: '企业视角', subtitle: '企业自服务工作台' }
      };

      // Page configurations for each scope
      var pageConfigByScope = {
        global: {
          dashboard: { src: './html/tax-swift-dashboard.html', title: '全球合规看板' },
          enterprise: { src: './html/tax-swift-tenant-enterprise-management.html', title: '企业管理' },
          api: { src: './html/tax-swift-api-detail.html', title: 'API 应用管理' },
          user: { src: './html/tax-swift-user-management.html', title: '用户管理' },
          audit: { src: './html/tax-swift-dashboard.html', title: '审计日志' }
        },
        enterprise: {
          dashboard: { src: './html/tax-swift-dashboard.html', title: '工作台' },
          customer: { src: './html/tax-swift-dashboard.html', title: '客户管理' },
          product: { src: './html/tax-swift-dashboard.html', title: '商品管理' },
          'create-invoice': { src: './html/tax-swift-dashboard.html', title: '创建发票' },
          invoice: { src: './html/tax-swift-dashboard.html', title: '发票管理' },
          'invoice-query': { src: './html/tax-swift-dashboard.html', title: '发票查询' },
          'abnormal-invoice': { src: './html/tax-swift-dashboard.html', title: '异常发票列表' },
          enterprise: { src: './html/tax-swift-enterprise-tax-compliance.html', title: '企业管理' },
          user: { src: './html/tax-swift-user-management.html', title: '用户管理' }
        }
      };

      function getActiveConfig() {
        return pageConfigByScope[currentScope];
      }

      // Navigate to a page
      function navigateTo(page) {
        var config = getActiveConfig()[page];
        if (!config) return;

        currentPage = page;

        getNavItems().forEach(function(item) {
          item.classList.toggle('active', item.dataset.page === page);
        });

        breadcrumbTitle.textContent = config.title;
        document.title = 'Tax-Swift - ' + config.title;
        iframe.src = config.src;
        history.replaceState(null, '', '#' + page);
      }

      // Switch scope
      function switchScope(scope, selectedItem) {
        var nextContextId = selectedItem && selectedItem.dataset.contextId ? selectedItem.dataset.contextId : scope;
        if (currentScope === scope && currentContextId === nextContextId) return;
        currentScope = scope;
        currentContextId = nextContextId;

        var label = scopeLabels[scope];
        scopeTitle.textContent = selectedItem && selectedItem.dataset.title ? selectedItem.dataset.title : label.title;
        scopeSubtitle.textContent = selectedItem && selectedItem.dataset.subtitle ? selectedItem.dataset.subtitle : label.subtitle;

        contextItems.forEach(function(item) {
          item.classList.toggle('active', item.dataset.contextId === currentContextId);
        });

        // Toggle nav visibility
        navGlobal.style.display = scope === 'global' ? '' : 'none';
        navEnterprise.style.display = scope === 'enterprise' ? '' : 'none';

        // Reload current page with the new scope's config
        var config = getActiveConfig();
        if (config[currentPage]) {
          navigateTo(currentPage);
        } else {
          navigateTo('dashboard');
        }
      }

      // ---- Scope Switch / Context Popover ----
      function setPopoverOpen(open) {
        contextPopover.hidden = !open;
        scopeSwitch.setAttribute('aria-expanded', String(open));
        if (open) {
          userMenu.classList.remove('open');
          contextSearch.value = '';
          filterContextItems('');
          contextSearch.focus();
        }
      }

      function filterContextItems(query) {
        var q = (query || '').trim().toLowerCase();
        var visibleBySection = { global: 0, enterprise: 0 };
        contextItems.forEach(function(item) {
          var text = item.textContent.toLowerCase();
          var hidden = q !== '' && !text.includes(q);
          item.classList.toggle('hidden-by-search', hidden);
          if (!hidden && item.dataset.scope) {
            visibleBySection[item.dataset.scope] += 1;
          }
        });
        contextSections.forEach(function(section) {
          section.classList.toggle('hidden-by-search', visibleBySection[section.dataset.contextSection] === 0);
        });
      }

      scopeSwitch.addEventListener('click', function(e) {
        e.stopPropagation();
        setPopoverOpen(contextPopover.hidden);
      });

      contextSearch.addEventListener('input', function() {
        filterContextItems(contextSearch.value);
      });

      contextSearch.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          setPopoverOpen(false);
          scopeSwitch.focus();
        }
      });

      contextItems.forEach(function(item) {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          setPopoverOpen(false);
          switchScope(item.dataset.scope, item);
        });
      });

      // ---- Nav click handlers ----
      function bindNavClick(navEl) {
        var items = navEl.querySelectorAll('.nav-item[data-page]');
        items.forEach(function(item) {
          item.addEventListener('click', function() {
            navigateTo(item.dataset.page);
          });
        });
      }
      bindNavClick(navGlobal);
      bindNavClick(navEnterprise);

      // ---- User Menu ----
      contextPopover.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      userSummary.addEventListener('click', function(e) {
        e.stopPropagation();
        userMenu.classList.toggle('open');
        if (!contextPopover.hidden) setPopoverOpen(false);
      });

      document.addEventListener('click', function() {
        userMenu.classList.remove('open');
        if (!contextPopover.hidden) setPopoverOpen(false);
      });

      // ---- Password Modal ----
      function setPasswordModalOpen(open) {
        passwordModal.hidden = !open;
        passwordModal.classList.toggle('open', open);
        document.body.classList.toggle('modal-open', open);
        if (open) {
          passwordModal.querySelector('input').focus();
        } else {
          openPasswordBtn.focus();
        }
      }

      openPasswordBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        userMenu.classList.remove('open');
        setPasswordModalOpen(true);
      });

      closePasswordBtns.forEach(function(btn) {
        btn.addEventListener('click', function() { setPasswordModalOpen(false); });
      });

      passwordModal.addEventListener('click', function(e) {
        if (e.target === passwordModal) setPasswordModalOpen(false);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (!contextPopover.hidden) {
            setPopoverOpen(false);
            scopeSwitch.focus();
          } else if (!passwordModal.hidden) {
            setPasswordModalOpen(false);
          }
        }
      });

      eyeButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var input = btn.parentElement.querySelector('input');
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      // ---- Hash-based navigation ----
      function handleHashChange() {
        var hash = location.hash.replace('#', '');
        if (hash && getActiveConfig()[hash]) navigateTo(hash);
      }

      window.addEventListener('hashchange', handleHashChange);

      if (location.hash && getActiveConfig()[location.hash.replace('#', '')]) {
        handleHashChange();
      }
    });
  </script>
