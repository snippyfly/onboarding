<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax-Swift 企业税务合规</title>
    <link rel="stylesheet" href="./tax-swift-enterprise-management.css" />
    <style>
      .tax-compliance-page {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-width: 0;
        min-height: 100vh;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: auto;
        color: #5d6984;
        font-size: 14px;
        font-weight: 600;
      }

      .breadcrumb strong {
        color: #15213a;
        font-size: 16px;
      }

      /* --- enterprise info card --- */
      .info-card {
        margin-top: 22px;
        padding: 22px 24px;
      }

      .info-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .info-card-head h2 {
        margin: 0;
        font-size: 18px;
      }

      .info-card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .info-item {
        min-height: 86px;
        padding: 16px 18px 14px;
        border: 1px solid #edf2f9;
        border-radius: 12px;
        background: #fbfdff;
      }

      .info-item label {
        display: block;
        margin-bottom: 8px;
        color: #76819b;
        font-size: 14px;
        font-weight: 700;
      }

      .info-item strong {
        display: block;
        color: #22304d;
        font-size: 17px;
        font-weight: 800;
      }

      /* --- country toggle --- */
      .country-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        margin-bottom: 18px;
      }

      .country-toggle span {
        color: #46536d;
        font-size: 15px;
        font-weight: 700;
      }

      .country-chip-group {
        display: flex;
        gap: 8px;
      }

      .country-chip {
        height: 38px;
        padding: 0 18px;
        border: 1px solid #dbe3f1;
        border-radius: 10px;
        background: #fff;
        color: #4a5670;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .country-chip.active {
        border-color: #1f6bff;
        background: linear-gradient(180deg, #edf5ff, #e8f2ff);
        color: #1f6bff;
      }

      /* --- tax form panel --- */
      .tax-form-panel {
        padding: 22px 24px;
      }

      .tax-form-panel .drawer-panel-head {
        margin-bottom: 6px;
      }

      .tax-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 24px;
        margin-top: 20px;
      }

      .tax-form-grid .field em {
        color: #ff3b30;
        font-style: normal;
      }

      .tax-form-note {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        margin-top: 24px;
        padding: 0 16px;
        border: 1px solid #fde3a2;
        border-radius: 12px;
        background: #fffaf0;
        color: #d27a20;
        font-size: 14px;
        font-weight: 700;
      }

      .tax-form-note .note-icon {
        font-size: 16px;
        line-height: 1;
      }

      .tax-form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 16px;
        margin-top: 28px;
      }

      .saved-toast {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 12px;
        background: #e8faf2;
        border: 1px solid #c9efd7;
        color: #19b96b;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(25, 185, 107, 0.16);
        opacity: 0;
        transform: translateY(-12px);
        transition: opacity 200ms ease, transform 200ms ease;
        pointer-events: none;
      }

      .saved-toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 1366px) {
        .tax-compliance-page {
          grid-template-columns: 248px 1fr;
        }

        .info-card-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 1120px) {
        .tax-compliance-page {
          grid-template-columns: 220px 1fr;
        }

        .tax-form-grid {
          grid-template-columns: 1fr;
        }

        .tax-form-grid .field-span-two {
          grid-column: auto;
        }
      }
    </style>
    <script>
      if (window.top !== window.self) {
        var f=document.createElement('style');
        f.textContent='.sidebar,aside.sidebar,.topbar,header.topbar,.password-modal-overlay,#passwordModal,[class*="password-modal"],.brand-panel,.scope-switch,.sidebar-nav,.sidebar-footer,.side-footer,.user-menu,[class*="user-menu"],script{display:none!important}.tax-compliance-page{display:block!important;grid-template-columns:none!important;min-height:auto!important;height:auto!important}.main-shell,[class*="main-shell"]{width:100%!important;min-width:0!important}html,body{overflow:auto!important;height:auto!important;min-height:100%!important;background:#f7f9fd!important}body{zoom:1!important}';
        document.head.appendChild(f);
      }
    </script>
  </head>
  <body>
    <div class="tax-compliance-page">
      <aside class="sidebar">
        <div class="brand-panel">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 60 60">
              <defs>
                <linearGradient id="bwHexCompliance" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#3ba4ff" />
                  <stop offset="100%" stop-color="#1655ea" />
                </linearGradient>
              </defs>
              <path d="M30 2 52 14v14L30 40 8 28V14Z" fill="url(#bwHexCompliance)" />
              <path d="M30 20 52 32v14L30 58 8 46V32Z" fill="url(#bwHexCompliance)" />
              <path d="m19 18 11-6 11 6m-22 24 11-6 11 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong>BAIWANG 百望</strong>
            <span>全球智能税务合规平台</span>
          </div>
        </div>

        <div class="scope-switch">
          <span class="scope-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" />
              <path d="M3.5 12h17M12 3.5c2.5 2.2 4 5.2 4 8.5s-1.5 6.3-4 8.5c-2.5-2.2-4-5.2-4-8.5s1.5-6.3 4-8.5Z" />
            </svg>
          </span>
          <span>企业视角</span>
          <span class="scope-chevron" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" /></svg>
          </span>
        </div>

        <nav class="sidebar-nav">
          <section class="nav-group">
            <h2>OVERVIEW</h2>
            <a class="nav-item" href="#">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4.5 4.5h6v6h-6Zm9 0h6v6h-6Zm-9 9h6v6h-6Zm9 0h6v6h-6Z" /></svg>
              </span>
              <span>全球合规看板</span>
            </a>
          </section>

          <section class="nav-group">
            <h2>DATA CENTER</h2>
            <a class="nav-item" href="#">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 4.5h12v15H6Z" /><path d="M9 8h6M9 12h6M9 16h4" /></svg>
              </span>
              <span>发票数据查询</span>
            </a>
            <a class="nav-item" href="#">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 5.5h14v13H5Z" /><path d="M5 10h14M10 5.5v13M14 10v8" /></svg>
              </span>
              <span>公司列表</span>
            </a>
          </section>

          <section class="nav-group">
            <h2>SECURITY & ACCESS</h2>
            <a class="nav-item active" href="#">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 5.5h14v13H5Z" /><path d="M5 10h14M10 5.5v13M14 10v8" /></svg>
              </span>
              <span>企业管理</span>
            </a>
          </section>
        </nav>

        <div class="sidebar-footer">
          <a class="nav-item" href="#">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3.8 8.4 5.2 5.8 7.8 4.4 11.4l1.4 3.6 2.6 2.6 3.6 1.4 3.6-1.4 2.6-2.6 1.4-3.6-1.4-3.6-2.6-2.6Z" /></svg>
            </span>
            <span>设置</span>
          </a>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div class="breadcrumb">
            <span>企业管理</span>
            <span>/</span>
            <strong>税务合规</strong>
          </div>
          <div class="user-summary">
            <div class="user-text">
              <strong>Enterprise Admin</strong>
              <span>百望越南工业有限公司</span>
            </div>
            <div class="avatar-wrap">
              <div class="avatar photo-avatar"></div>
            </div>
          </div>
        </header>

        <main class="content">
          <section class="page-title">
            <h1>企业管理</h1>
          </section>

          <!-- enterprise info card (read-only) -->
          <section class="panel info-card">
            <div class="info-card-head">
              <h2>企业基本信息</h2>
              <span class="status-pill configured" style="font-size:13px;">已认证</span>
            </div>
            <div class="info-card-grid">
              <div class="info-item">
                <label>企业名称</label>
                <strong>百望越南工业有限公司</strong>
              </div>
              <div class="info-item">
                <label>企业编码</label>
                <strong>CMP-VN-0001</strong>
              </div>
              <div class="info-item">
                <label>国别</label>
                <strong>越南</strong>
              </div>
              <div class="info-item">
                <label>企业联系邮箱</label>
                <strong>finance.vn@baiwang.com</strong>
              </div>
            </div>
          </section>

          <!-- country toggle -->
          <div class="country-toggle">
            <span>税务合规国别：</span>
            <div class="country-chip-group">
              <button class="country-chip active" data-tax-country="越南" type="button">越南</button>
              <button class="country-chip" data-tax-country="马来西亚" type="button">马来西亚</button>
            </div>
          </div>

          <!-- tax compliance form -->
          <section class="panel tax-form-panel">
            <div class="drawer-panel-head">
              <div>
                <h3 id="taxFormTitle">越南税务合规信息</h3>
                <p id="taxFormDesc">维护当前企业开票所需的地址与税务资料。</p>
              </div>
            </div>

            <!-- Vietnam tax fields -->
            <div class="tax-form-grid country-tax-section active" id="vietnamTaxFields">
              <label class="field">
                <span>税务登记号（MST） <em>*</em></span>
                <input id="vietnamMst" type="text" placeholder="请输入税务登记号（MST）" value="0312345678" />
              </label>
              <label class="field">
                <span>联系电话</span>
                <input id="vietnamPhone" type="text" placeholder="请输入联系电话" value="+84 28 3822 8899" />
              </label>
              <label class="field field-span-two">
                <span>地址 <em>*</em></span>
                <input id="vietnamAddress" type="text" placeholder="请输入地址" value="123 Nguyen Hue Street, District 1, Ho Chi Minh City, Vietnam" />
              </label>
            </div>

            <!-- Malaysia tax fields -->
            <div class="tax-form-grid country-tax-section" id="malaysiaTaxFields">
              <label class="field">
                <span>税务登记号（TIN） <em>*</em></span>
                <input id="malaysiaTin" type="text" placeholder="请输入税务登记号（TIN）" />
              </label>
              <label class="field">
                <span>商业注册号（BRN） <em>*</em></span>
                <input id="malaysiaBrn" type="text" placeholder="请输入商业注册号（BRN）" />
              </label>
              <label class="field">
                <span>销售与服务税注册号（SST）</span>
                <input id="malaysiaSst" type="text" placeholder="请输入销售与服务税注册号（SST）" />
              </label>
              <label class="field">
                <span>旅游税注册号（TTX）</span>
                <input id="malaysiaTtx" type="text" placeholder="请输入旅游税注册号（TTX）" />
              </label>
              <label class="field">
                <span>行业代码（MSIC） <em>*</em></span>
                <input id="malaysiaMsic" type="text" placeholder="请输入行业代码（MSIC）" />
              </label>
              <label class="field">
                <span>州/省 <em>*</em></span>
                <span class="select-shell">
                  <select id="malaysiaRegion">
                    <option>请选择州/省</option>
                    <option>Wilayah Persekutuan</option>
                    <option>Selangor</option>
                    <option>Johor</option>
                  </select>
                </span>
              </label>
              <label class="field">
                <span>城市 <em>*</em></span>
                <input id="malaysiaCity" type="text" placeholder="请输入城市" />
              </label>
              <label class="field">
                <span>邮编 <em>*</em></span>
                <input id="malaysiaPostcode" type="text" placeholder="请输入邮编" />
              </label>
              <label class="field field-span-two">
                <span>地址1 <em>*</em></span>
                <input id="malaysiaAddress1" type="text" placeholder="楼层、街道、楼宇名称" />
              </label>
              <label class="field field-span-two">
                <span>地址2</span>
                <input id="malaysiaAddress2" type="text" placeholder="区域或补充地址，可选" />
              </label>
              <label class="field field-span-two">
                <span>地址3</span>
                <input id="malaysiaAddress3" type="text" placeholder="补充地址，可选" />
              </label>
              <label class="field">
                <span>联系电话 <em>*</em></span>
                <input id="malaysiaPhone" type="text" placeholder="请输入联系电话" />
              </label>
            </div>

            <div class="tax-form-note">
              <span class="note-icon" aria-hidden="true">⚠</span>
              <span>税务合规信息不完整将影响开票能力，请确保必填字段均已填写。</span>
            </div>

            <div class="tax-form-actions">
              <button class="button ghost" id="resetForm" type="button">重置</button>
              <button class="button primary" id="saveForm" type="button">保存税务合规信息</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="saved-toast" id="savedToast">
      <span>✓</span>
      <span>税务合规信息已保存</span>
    </div>

    <script>
      const countryChips = document.querySelectorAll(".country-chip");
      const vietnamFields = document.getElementById("vietnamTaxFields");
      const malaysiaFields = document.getElementById("malaysiaTaxFields");
      const taxFormTitle = document.getElementById("taxFormTitle");
      const taxFormDesc = document.getElementById("taxFormDesc");
      const savedToast = document.getElementById("savedToast");

      const taxConfig = {
        "越南": {
          title: "越南税务合规信息",
          desc: "维护当前企业开票所需的越南 MST、地址与联系电话信息。",
        },
        "马来西亚": {
          title: "马来西亚税务合规信息",
          desc: "维护当前企业开票所需的马来西亚 TIN、BRN、MSIC、地址与联系电话信息。",
        },
      };

      // --- initial form values for reset ---
      const initialValues = {};

      function captureInitialValues() {
        document.querySelectorAll(".tax-form-grid input, .tax-form-grid select").forEach(input => {
          initialValues[input.id] = input.value;
        });
      }

      function switchCountry(country) {
        countryChips.forEach(chip => {
          const active = chip.dataset.taxCountry === country;
          chip.classList.toggle("active", active);
        });

        const config = taxConfig[country];
        taxFormTitle.textContent = config.title;
        taxFormDesc.textContent = config.desc;

        const isVietnam = country === "越南";
        vietnamFields.classList.toggle("active", isVietnam);
        vietnamFields.hidden = !isVietnam;
        vietnamFields.setAttribute("aria-hidden", String(!isVietnam));

        malaysiaFields.classList.toggle("active", !isVietnam);
        malaysiaFields.hidden = isVietnam;
        malaysiaFields.setAttribute("aria-hidden", String(isVietnam));
      }

      function showToast() {
        savedToast.classList.add("show");
        clearTimeout(savedToast._timeout);
        savedToast._timeout = setTimeout(() => {
          savedToast.classList.remove("show");
        }, 2200);
      }

      countryChips.forEach(chip => {
        chip.addEventListener("click", () => switchCountry(chip.dataset.taxCountry));
      });

      document.getElementById("saveForm").addEventListener("click", () => {
        const activeFields = vietnamFields.hidden ? malaysiaFields : vietnamFields;
        const inputs = activeFields.querySelectorAll("input[type='text'], input[type='email']");
        const requiredFilled = Array.from(inputs).every(input => {
          const field = input.closest(".field");
          const isRequired = field && field.querySelector("em");
          return !isRequired || input.value.trim() !== "";
        });

        if (!requiredFilled) {
          alert("请填写所有必填字段");
          return;
        }

        captureInitialValues();
        showToast();
      });

      document.getElementById("resetForm").addEventListener("click", () => {
        document.querySelectorAll(".tax-form-grid input, .tax-form-grid select").forEach(input => {
          if (initialValues[input.id] !== undefined) {
            input.value = initialValues[input.id];
          }
        });
      });

      captureInitialValues();
      switchCountry("越南");
    </script>
  </body>
</html>
